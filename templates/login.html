<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Next-Gen Hospital</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- HEADER -->
<header class="navbar">
    <div class="nav-container">
        <h2 class="logo">Next-Gen Hospital</h2>
        <nav>
            <a href="/">Home</a>
            <a href="/doctors">Doctors</a>
            <a href="/appointments">Appointments</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
            <a href="/register">Register</a>
        </nav>
    </div>
</header>

<div class="page-bg">
    <div class="auth-box">

        <!-- ICON -->
        <div class="auth-icon">
            👤
        </div>

        <h2>Welcome Back</h2>
        <p class="auth-subtext">Sign in to your account</p>

        <form method="POST" action="/login">

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>

            <div class="auth-row">
                <label class="remember">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="link">Forgot password?</a>
            </div>

            <button type="submit" class="btn-primary full-btn">
                Sign In
            </button>
        </form>

        <p class="switch-auth">
            Don’t have an account?
            <a href="/register">Register here</a>
        </p>

        <div class="divider">Or continue with</div>

        <div class="social-buttons">
            <button class="social google">Google</button>
            <button class="social facebook">Facebook</button>
        </div>

    </div>
</div>

</body>
</html>
